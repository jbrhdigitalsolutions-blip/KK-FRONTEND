name: KK-FRONTEND CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Syntax checks
        run: pnpm run check

      - name: Self test
        run: pnpm run selftest

      - name: Full internal tests
        run: node --test tests/*.test.mjs
